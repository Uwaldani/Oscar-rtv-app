<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oscar RTV</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">
          <img src="assets/images/Rouge-02.png" alt="Oscar RTV Logo" />
        </div>

        <div class="brand-text">
          <h2>Oscar RTV</h2>
          <p>Inspirer • Informer • Connecter</p>
        </div>
      </div>

      <ul class="menu">
        <li class="active" data-section="home">Accueil</li>
        <li data-section="radio">Radio En Direct</li>
        <li data-section="tv">Live TV</li>
        <li data-section="podcasts">Podcasts</li>
        <li data-section="videos">Videos</li>
        <li data-section="favorites">Favorites</li>
        <li data-section="photos">Photos</li>
        <li data-section="about">About</li>
        <li data-section="contact">Contact</li>
        <li data-section="website">Website</li>
        <li data-section="services">Nos services</li>
      </ul>
    </aside>

    <main class="content">
      <div class="topbar">
        <div>
          <h1>Oscar RTV</h1>
          <p class="subtitle">Plateforme média moderne haïtienne</p>
        </div>

        <div class="search-icon">⌕</div>
      </div>

      <div id="main-content"></div>

      <div class="footer-box">© 2026 Oscar RTV — Tous droits réservés</div>

</main>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
</html>
